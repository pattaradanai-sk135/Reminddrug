<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Calendar & Frequency Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .app-container { grid-template-columns: 340px 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .streak-badge {
            background-color: #fef3c7;
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Calendar Styles */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header button {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            padding-bottom: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            cursor: pointer;
            position: relative;
        }

        .day-cell:hover { background-color: #f1f5f9; }
        .day-cell.selected { border-color: var(--primary); font-weight: bold; }
        .day-cell.today { background-color: #e0e7ff; color: var(--primary); font-weight: bold; }
        .day-cell.completed { background-color: var(--success-light); color: #065f46; }
        
        .dot-indicator {
            width: 4px;
            height: 4px;
            background-color: var(--primary);
            border-radius: 50%;
            margin-top: 2px;
        }

        /* Form Styles */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.875rem;
            outline: none;
        }

        .days-selector {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .day-btn {
            flex: 1;
            padding: 6px 0;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            cursor: pointer;
        }

        .day-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover { background-color: var(--primary-hover); }

        /* Med List Styles */
        .med-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .med-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background-color: #fff;
        }

        .med-item.taken { background-color: #f0fdf4; border-color: #bbf7d0; }
        .med-item.taken .med-name { text-decoration: line-through; color: var(--text-muted); }

        .med-info { display: flex; flex-direction: column; }
        .med-name { font-weight: 600; font-size: 0.95rem; }
        .med-details { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        .check-btn {
            background: none;
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .med-item.taken .check-btn { background-color: var(--success); border-color: var(--success); color: white; }
        .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; margin-left: 8px; }
        .delete-btn:hover { color: var(--danger); }
        .empty-state { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left Column: Calendar & Add Med Form -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
        
        <!-- Calendar Card -->
        <div class="card">
            <div class="header">
                <h3 style="font-size:1.1rem;">Calendar</h3>
                <div class="streak-badge">🔥 <span id="streak-count">0</span> Day Streak</div>
            </div>
            <div class="calendar-header">
                <button id="prev-month">&lt;</button>
                <strong id="calendar-month-year"></strong>
                <button id="next-month">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <!-- Add Medication Form Card -->
        <div class="card">
            <h3 style="font-size:1.1rem; margin-bottom: 12px;">Add Medication</h3>
            <form id="med-form">
                <div class="form-group">
                    <label>Medication Name</label>
                    <input type="text" id="med-name" placeholder="e.g. Amoxicillin" required />
                </div>
                <div class="form-group">
                    <label>Dosage</label>
                    <input type="text" id="med-dosage" placeholder="e.g. 500mg" required />
                </div>
                <div class="form-group">
                    <label>Schedule Type</label>
                    <select id="med-freq-type">
                        <option value="daily">Daily</option>
                        <option value="specific_days">Specific Days of Week</option>
                        <option value="interval">Interval (Every X hours)</option>
                    </select>
                </div>

                <!-- Custom Frequency Options -->
                <div id="days-option" class="form-group" style="display: none;">
                    <label>Select Days</label>
                    <div class="days-selector">
                        <button type="button" class="day-btn" data-day="0">S</button>
                        <button type="button" class="day-btn" data-day="1">M</button>
                        <button type="button" class="day-btn" data-day="2">T</button>
                        <button type="button" class="day-btn" data-day="3">W</button>
                        <button type="button" class="day-btn" data-day="4">T</button>
                        <button type="button" class="day-btn" data-day="5">F</button>
                        <button type="button" class="day-btn" data-day="6">S</button>
                    </div>
                </div>

                <div id="interval-option" class="form-group" style="display: none;">
                    <label>Frequency (Hours)</label>
                    <input type="number" id="med-interval" min="1" max="24" value="8" placeholder="e.g. 8" />
                </div>

                <button type="submit" class="btn-submit">Add Schedule</button>
            </form>
        </div>
    </div>

    <!-- Right Column: Selected Day Schedule -->
    <div class="card">
        <div class="header">
            <h2 id="selected-date-title" style="font-size:1.2rem;">Today's Medications</h2>
        </div>
        <ul class="med-list" id="med-list"></ul>
    </div>
</div>

<script>
    // State Initialization
    let state = JSON.parse(localStorage.getItem('medCalendarState')) || {
        medications: [],
        logs: {} // Formatted as { "YYYY-MM-DD": { medId: true/false } }
    };

    let currentDate = new Date();
    let selectedDateStr = formatDate(new Date());
    let selectedDaysOfWeek = [];

    // Elements
    const calendarGrid = document.getElementById('calendar-grid');
    const calendarMonthYear = document.getElementById('calendar-month-year');
    const selectedDateTitle = document.getElementById('selected-date-title');
    const medList = document.getElementById('med-list');
    const medForm = document.getElementById('med-form');
    const freqTypeSelect = document.getElementById('med-freq-type');
    const daysOption = document.getElementById('days-option');
    const intervalOption = document.getElementById('interval-option');
    const streakCount = document.getElementById('streak-count');

    function saveState() {
        localStorage.setItem('medCalendarState', JSON.stringify(state));
    }

    function formatDate(d) {
        return d.toISOString().split('T')[0];
    }

    // Dynamic Form UI Toggle
    freqTypeSelect.addEventListener('change', (e) => {
        daysOption.style.display = e.target.value === 'specific_days' ? 'block' : 'none';
        intervalOption.style.display = e.target.value === 'interval' ? 'block' : 'none';
    });

    document.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const day = parseInt(btn.dataset.day);
            if (selectedDaysOfWeek.includes(day)) {
                selectedDaysOfWeek = selectedDaysOfWeek.filter(d => d !== day);
                btn.classList.remove('active');
            } else {
                selectedDaysOfWeek.push(day);
                btn.classList.add('active');
            }
        });
    });

    // Check if medication is scheduled on a given date
    function isMedScheduledForDate(med, dateStr) {
        const targetDate = new Date(dateStr + 'T00:00:00');
        const dayOfWeek = targetDate.getDay();

        if (med.freqType === 'daily') return true;
        if (med.freqType === 'specific_days') return med.days.includes(dayOfWeek);
        if (med.freqType === 'interval') return true; // Interval dosage tracked daily

        return true;
    }

    // Render Calendar
    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        calendarMonthYear.textContent = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const dayLabels = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        dayLabels.forEach(d => {
            const el = document.createElement('div');
            el.className = 'day-label';
            el.textContent = d;
            calendarGrid.appendChild(el);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayStr = formatDate(new Date());

        for (let i = 0; i < firstDayIndex; i++) {
            calendarGrid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cellDate = new Date(year, month, day);
            const dateStr = formatDate(cellDate);
            
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = day;

            if (dateStr === todayStr) cell.classList.add('today');
            if (dateStr === selectedDateStr) cell.classList.add('selected');

            // Evaluate completion for history
            const scheduledMeds = state.medications.filter(m => isMedScheduledForDate(m, dateStr));
            if (scheduledMeds.length > 0) {
                const dayLogs = state.logs[dateStr] || {};
                const allTaken = scheduledMeds.every(m => dayLogs[m.id]);
                if (allTaken) cell.classList.add('completed');
                else {
                    const dot = document.createElement('div');
                    dot.className = 'dot-indicator';
                    cell.appendChild(dot);
                }
            }

            cell.addEventListener('click', () => {
                selectedDateStr = dateStr;
                renderCalendar();
                renderMedList();
            });

            calendarGrid.appendChild(cell);
        }
    }

    // Calculate Streak
    function calculateStreak() {
        let streak = 0;
        let checkDate = new Date();

        while (true) {
            const dateStr = formatDate(checkDate);
            const scheduledMeds = state.medications.filter(m => isMedScheduledForDate(m, dateStr));
            
            if (scheduledMeds.length === 0) {
                checkDate.setDate(checkDate.getDate() - 1);
                continue;
            }

            const dayLogs = state.logs[dateStr] || {};
            const allTaken = scheduledMeds.every(m => dayLogs[m.id]);

            if (allTaken) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            } else if (dateStr === formatDate(new Date())) {
                // If today is not completed yet, keep checking yesterday without breaking streak
                checkDate.setDate(checkDate.getDate() - 1);
            } else {
                break; // Broken streak
            }
        }
        streakCount.textContent = streak;
    }

    // Render Medication List for Selected Date
    function renderMedList() {
        const displayDate = new Date(selectedDateStr + 'T00:00:00');
        selectedDateTitle.textContent = selectedDateStr === formatDate(new Date()) 
            ? "Today's Schedule" 
            : displayDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        medList.innerHTML = '';
        const scheduledMeds = state.medications.filter(m => isMedScheduledForDate(m, selectedDateStr));

        if (scheduledMeds.length === 0) {
            medList.innerHTML = '<li class="empty-state">No medications scheduled for this date.</li>';
            return;
        }

        const dayLogs = state.logs[selectedDateStr] || {};

        scheduledMeds.forEach(med => {
            const isTaken = !!dayLogs[med.id];
            const li = document.createElement('li');
            li.className = `med-item ${isTaken ? 'taken' : ''}`;

            let freqLabel = 'Daily';
            if (med.freqType === 'specific_days') freqLabel = 'Custom Days';
            if (med.freqType === 'interval') freqLabel = `Every ${med.interval} hours`;

            li.innerHTML = `
                <div class="med-info">
                    <span class="med-name">${escapeHtml(med.name)}</span>
                    <span class="med-details">${escapeHtml(med.dosage)} &bull; ${freqLabel}</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <button class="check-btn" onclick="toggleMed(${med.id})">${isTaken ? '✓' : ''}</button>
                    <button class="delete-btn" onclick="deleteMed(${med.id})">&times;</button>
                </div>
            `;
            medList.appendChild(li);
        });
    }

    function toggleMed(id) {
        if (!state.logs[selectedDateStr]) state.logs[selectedDateStr] = {};
        state.logs[selectedDateStr][id] = !state.logs[selectedDateStr][id];
        saveState();
        renderMedList();
        renderCalendar();
        calculateStreak();
    }

    function deleteMed(id) {
        state.medications = state.medications.filter(m => m.id !== id);
        saveState();
        renderMedList();
        renderCalendar();
        calculateStreak();
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    // Form Handler
    medForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('med-name').value.trim();
        const dosage = document.getElementById('med-dosage').value.trim();
        const freqType = freqTypeSelect.value;
        const interval = document.getElementById('med-interval').value;

        if (!name || !dosage) return;

        const newMed = {
            id: Date.now(),
            name,
            dosage,
            freqType,
            days: [...selectedDaysOfWeek],
            interval: freqType === 'interval' ? parseInt(interval) : null
        };

        state.medications.push(newMed);
        saveState();

        // Reset Form
        document.getElementById('med-name').value = '';
        document.getElementById('med-dosage').value = '';
        selectedDaysOfWeek = [];
        document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));

        renderCalendar();
        renderMedList();
        calculateStreak();
    });

    // Calendar Navigation Controls
    document.getElementById('prev-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    // Initial Execution
    renderCalendar();
    renderMedList();
    calculateStreak();
</script>
</body>
</html>

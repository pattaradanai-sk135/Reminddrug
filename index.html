<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Med Tracker</title>
<style>
  :root{
    --bg:#1b1b1b;
    --card:#2a2a2a;
    --accent:#e8b04b;
    --accent2:#6bb894;
    --text:#f2f2f2;
    --muted:#999;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
    max-width:480px;
    margin:0 auto;
  }
  h1{
    font-size:1.4rem;
    text-align:center;
    margin-bottom:4px;
  }
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .day-count{
    text-align:center;
  }
  .day-count .num{
    font-size:3rem;
    font-weight:700;
    color:var(--accent2);
    line-height:1;
  }
  .day-count .label{
    color:var(--muted);
    font-size:.9rem;
    margin-top:4px;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  input, select{
    background:#3a3a3a;
    border:1px solid #4a4a4a;
    color:var(--text);
    padding:10px;
    border-radius:8px;
    font-size:1rem;
    width:100%;
  }
  label{
    font-size:.8rem;
    color:var(--muted);
    display:block;
    margin-bottom:4px;
  }
  button{
    background:var(--accent);
    color:#1b1b1b;
    border:none;
    padding:12px;
    border-radius:8px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    width:100%;
    margin-top:10px;
  }
  button:active{ opacity:.8; }
  button.secondary{
    background:#3a3a3a;
    color:var(--text);
    font-weight:500;
  }
  .med-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #3a3a3a;
  }
  .med-item:last-child{ border-bottom:none; }
  .med-name{ font-weight:600; }
  .med-time{ color:var(--accent); font-size:.9rem; }
  .taken-btn{
    background:var(--accent2);
    color:#1b1b1b;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
    width:auto;
    margin:0;
  }
  .taken-btn.done{
    background:#4a4a4a;
    color:var(--muted);
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:20px 0;
    font-size:.9rem;
  }
  .del{
    background:none;
    border:none;
    color:#c66;
    font-size:1.1rem;
    width:auto;
    padding:0 6px;
    margin:0;
  }
  .cal-header{
    font-size:.75rem;
    color:var(--muted);
    text-align:center;
    margin-bottom:6px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:3px;
  }
  .cal-dow{
    text-align:center;
    font-size:.65rem;
    color:var(--muted);
    padding-bottom:2px;
  }
  .cal-cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.7rem;
    border-radius:6px;
    background:#333;
    color:var(--muted);
  }
  .cal-cell.empty-cell{
    background:none;
  }
  .cal-cell.taken{
    background:var(--accent2);
    color:#1b1b1b;
    font-weight:700;
  }
  .cal-cell.today{
    border:1.5px solid var(--accent);
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  #status{
    text-align:center;
    font-size:.8rem;
    color:var(--muted);
    min-height:16px;
    margin-top:6px;
  }
</style>
</head>
<body>

<h1>💊 Med Tracker</h1>
<div class="sub">Take drug on time. Count the days.</div>

<div class="card day-count">
  <div class="num" id="dayNum">0</div>
  <div class="label">days since start</div>
  <button class="secondary" id="resetDayBtn">Reset day counter</button>
</div>

<div class="card">
  <div class="row" style="margin-bottom:10px;">
    <strong>Today's meds</strong>
  </div>
  <div id="medList"><div class="empty">No med added yet.</div></div>
</div>

<div class="card">
  <strong>Add a med reminder</strong>
  <div class="form-grid" style="margin-top:10px;">
    <div>
      <label>Name</label>
      <input type="text" id="medName" placeholder="e.g. Aspirin">
    </div>
    <div>
      <label>Time</label>
      <input type="time" id="medTime">
    </div>
  </div>
  <button id="addMedBtn">Add reminder</button>
  <div id="status"></div>
</div>

<script>
const DAY_KEY = 'startDate';
const MED_KEY = 'medsList';
const TAKEN_KEY_PREFIX = 'taken:';

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function getVal(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('storage error', e);
    return null;
  }
}
function setVal(key, val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){
    console.error('storage error', e);
  }
}

async function initDayCounter(){
  let start = await getVal(DAY_KEY);
  if(!start){
    start = todayStr();
    await setVal(DAY_KEY, start);
  }
  renderDayCount(start);
}

function renderDayCount(start){
  const startDate = new Date(start + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - startDate) / (1000*60*60*24)) + 1;
  document.getElementById('dayNum').textContent = diffDays > 0 ? diffDays : 1;
}

document.getElementById('resetDayBtn').addEventListener('click', async ()=>{
  const start = todayStr();
  await setVal(DAY_KEY, start);
  renderDayCount(start);
});

let medsCache = null;

async function loadMeds(){
  if(medsCache !== null) return medsCache;
  const meds = await getVal(MED_KEY);
  medsCache = meds || [];
  return medsCache;
}
async function saveMeds(meds){
  medsCache = meds;
  await setVal(MED_KEY, meds);
}

async function renderMeds(){
  const meds = await loadMeds();
  const list = document.getElementById('medList');
  if(meds.length === 0){
    list.innerHTML = '<div class="empty">No med added yet.</div>';
    return;
  }
  const today = todayStr();
  meds.sort((a,b)=> a.time.localeCompare(b.time));

  list.innerHTML = '';
  meds.forEach((m)=>{
    if(!m.takenDates) m.takenDates = [];
    const dayN = m.takenDates.length;
    const isTaken = m.takenDates.includes(today);
    const item = document.createElement('div');
    item.className = 'med-item';
    item.style.flexDirection = 'column';
    item.style.alignItems = 'stretch';
    item.innerHTML = `
      <div class="row" style="margin-bottom:8px;">
        <div>
          <div class="med-name">${escapeHtml(m.name)} <span style="color:var(--accent2); font-weight:600;">— Day ${dayN}</span></div>
          <div class="med-time">${formatTime(m.time)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="taken-btn ${isTaken?'done':''}" data-id="${m.id}">${isTaken ? 'Taken ✓' : 'Mark taken'}</button>
          <button class="del" data-id="${m.id}">✕</button>
        </div>
      </div>
      <div class="cal" data-cal="${m.id}"></div>
    `;
    list.appendChild(item);
    renderCalendar(item.querySelector(`.cal[data-cal="${m.id}"]`), m.takenDates);
  });

  list.querySelectorAll('.taken-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      const meds = await loadMeds();
      const med = meds.find(m => m.id === id);
      if(!med) return;
      if(!med.takenDates) med.takenDates = [];
      const today = todayStr();
      const idx = med.takenDates.indexOf(today);
      if(idx >= 0){
        med.takenDates.splice(idx, 1);
      } else {
        med.takenDates.push(today);
      }
      await saveMeds(meds);
      renderMeds();
    });
  });

  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-id');
      let meds = await loadMeds();
      meds = meds.filter(m=>m.id !== id);
      await saveMeds(meds);
      renderMeds();
    });
  });
}

function renderCalendar(container, takenDates){
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const todayNum = now.getDate();
  const monthName = now.toLocaleString('default', { month: 'long' });

  const takenSet = new Set(takenDates);

  let html = `<div class="cal-header">${monthName} ${year}</div><div class="cal-grid">`;
  ['S','M','T','W','T','F','S'].forEach(d=>{
    html += `<div class="cal-dow">${d}</div>`;
  });
  for(let i=0; i<startWeekday; i++){
    html += `<div class="cal-cell empty-cell"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const taken = takenSet.has(dateStr);
    const isToday = d === todayNum;
    html += `<div class="cal-cell ${taken?'taken':''} ${isToday?'today':''}">${d}</div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}

function daysSince(dateStr){
  const start = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diff = Math.floor((now - start) / (1000*60*60*24)) + 1;
  return diff > 0 ? diff : 1;
}

function formatTime(t){
  const [h,m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('addMedBtn').addEventListener('click', async ()=>{
  const nameEl = document.getElementById('medName');
  const timeEl = document.getElementById('medTime');
  const status = document.getElementById('status');
  const name = nameEl.value.trim();
  const time = timeEl.value;
  nameEl.style.borderColor = name ? '#4a4a4a' : '#c66';
  timeEl.style.borderColor = time ? '#4a4a4a' : '#c66';
  if(!name || !time){
    status.textContent = 'Need both name and time (fields in red).';
    return;
  }
  const meds = await loadMeds();
  meds.push({ id: 'm' + Date.now(), name, time, takenDates: [] });
  await saveMeds(meds);
  nameEl.value = '';
  timeEl.value = '';
  status.textContent = 'Added: ' + name;
  setTimeout(()=> status.textContent = '', 1500);
  await renderMeds();
});

// init
initDayCounter();
renderMeds();
setInterval(async ()=>{
  const start = await getVal(DAY_KEY);
  if(start) renderDayCount(start);
}, 60000);
</script>

</body>
</html>
